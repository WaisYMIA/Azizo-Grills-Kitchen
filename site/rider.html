<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Azizo Riders</title>
<style>
  :root{
    --dark:#161210; --darker:#070605; --gold:#C89B3C; --gold-soft:#E4C88A;
    --cream:#F3ECE0; --paper:#FBF8F2; --ink:#221A17; --ink-soft:#5A4E48; --line:#DDD0BC;
    --red:#B23A3A; --green:#2E7D46; --blue:#2F6DB5; --amber:#C27C0E;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;}
  .wrap{max-width:900px;margin:0 auto;padding:0 16px;}

  /* login */
  .gate{max-width:380px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:26px;}
  .gate h2{margin:0 0 6px;}
  .gate p{margin:0 0 10px;font-size:13px;color:var(--ink-soft);line-height:1.5;}
  .gate label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-top:12px;}
  .gate input{width:100%;padding:12px;border:1px solid var(--line);border-radius:6px;font-size:16px;margin-top:4px;}
  .gate button{width:100%;margin-top:16px;padding:13px;border:none;border-radius:6px;background:var(--dark);color:var(--cream);font-size:15px;font-weight:700;}
  .err{color:var(--red);font-size:13px;margin-top:10px;min-height:16px;}
  .back-link{display:inline-block;margin-top:14px;font-size:13px;color:var(--ink-soft);}

  /* top bar + tabs */
  header{background:var(--darker);color:var(--cream);position:sticky;top:0;z-index:20;}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;}
  .bar h1{margin:0;font-size:17px;}
  .bar small{display:block;color:#C9B8A9;font-size:11.5px;margin-top:2px;}
  .bar-actions{display:flex;gap:8px;align-items:center;}
  .ghost{background:transparent;border:1px solid #5b4f48;color:var(--cream);border-radius:6px;padding:7px 11px;font-size:12.5px;min-height:36px;}
  .ghost.on{border-color:var(--gold);color:var(--gold);}
  .tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-top:1px solid #2a221e;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:1 0 auto;background:none;border:none;color:#C9B8A9;padding:13px 16px;font-size:14px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap;min-height:46px;}
  .tab.active{color:var(--gold);border-bottom-color:var(--gold);}
  .badge{display:inline-block;min-width:20px;padding:1px 6px;margin-left:6px;border-radius:10px;background:var(--red);color:#fff;font-size:11.5px;text-align:center;}
  .badge:empty,.badge.zero{display:none;}
  main{padding:16px 0 60px;}
  .pane{display:none;} .pane.active{display:block;}

  /* controls */
  .controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center;}
  .chip{background:#fff;border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink-soft);min-height:38px;}
  .chip.active{background:var(--dark);border-color:var(--dark);color:var(--cream);}
  .field{padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;background:#fff;min-height:42px;}
  .grow{flex:1;min-width:140px;}
  .note{font-size:12.5px;color:var(--ink-soft);margin:0 0 10px;}
  .empty{background:#fff;border:1px dashed var(--line);border-radius:10px;padding:30px 16px;text-align:center;color:var(--ink-soft);font-size:14px;}

  /* order cards */
  .order{background:#fff;border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden;}
  .order.st-received{border-left-color:var(--red);} .order.st-preparing{border-left-color:var(--amber);}
  .order.st-ready{border-left-color:var(--green);} .order.st-out_for_delivery{border-left-color:var(--blue);}
  .order.st-completed{border-left-color:#9a9086;} .order.st-cancelled{border-left-color:#c9bfb4;opacity:.8;}
  .order.fresh{box-shadow:0 0 0 2px var(--gold);}
  .o-head{width:100%;text-align:left;background:none;border:none;padding:14px;display:flex;justify-content:space-between;gap:12px;color:inherit;}
  .o-id{font-weight:800;font-size:16px;}
  .o-new{background:var(--red);color:#fff;font-size:10.5px;font-weight:800;border-radius:4px;padding:2px 6px;margin-left:6px;vertical-align:middle;}
  .o-sub{font-size:13px;color:var(--ink-soft);margin-top:3px;line-height:1.45;}
  .o-right{text-align:right;flex-shrink:0;}
  .o-total{font-weight:700;font-size:15px;}
  .status{display:inline-block;margin-top:5px;padding:3px 9px;border-radius:12px;font-size:11.5px;font-weight:700;color:#fff;background:#777;}
  .status.received{background:var(--red);} .status.preparing{background:var(--amber);} .status.ready{background:var(--green);}
  .status.out_for_delivery{background:var(--blue);} .status.completed{background:#9a9086;} .status.cancelled{background:#b8aea3;}
  .o-body{display:none;padding:0 14px 14px;border-top:1px solid #efe6d6;}
  .order.open .o-body{display:block;}
  .items{width:100%;border-collapse:collapse;margin:12px 0 8px;font-size:14px;}
  .items td{padding:7px 0;border-bottom:1px solid #f0e9dc;}
  .items td.n{text-align:right;white-space:nowrap;font-family:ui-monospace,Menlo,monospace;}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;margin:8px 0;}
  .kv b{color:var(--ink-soft);font-weight:600;}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .btn{border:none;border-radius:8px;padding:12px 16px;font-size:14px;font-weight:700;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
  .btn.primary{background:var(--dark);color:var(--cream);flex:1 1 180px;}
  .btn.go{background:var(--green);color:#fff;flex:1 1 180px;}
  .btn.light{background:var(--paper);border:1px solid var(--line);color:var(--ink);}
  .btn.danger{background:#fff;border:1px solid var(--red);color:var(--red);}
  .btn:disabled{opacity:.5;}
  .fix{margin-top:12px;font-size:12.5px;color:var(--ink-soft);}
  .fix select{margin-left:6px;padding:7px;border:1px solid var(--line);border-radius:6px;font-size:13px;}

  /* today */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px;}
  .tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;}
  .tile b{display:block;font-size:24px;margin-bottom:2px;} .tile span{font-size:12.5px;color:var(--ink-soft);}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;}
  .card h3{margin:0 0 8px;font-size:14.5px;}
  .tbl{width:100%;border-collapse:collapse;font-size:14px;} .tbl td{padding:7px 0;border-bottom:1px solid #f0e9dc;} .tbl td:last-child{text-align:right;font-family:ui-monospace,Menlo,monospace;}

  /* stock */
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:8px;}
  .row.out{background:#fbf1f1;}
  .row small{display:block;color:var(--ink-soft);font-size:12px;margin-top:2px;}
  .switch{position:relative;width:54px;height:30px;flex-shrink:0;}
  .switch input{opacity:0;width:100%;height:100%;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1;}
  .switch i{position:absolute;inset:0;background:#c9bfb4;border-radius:15px;transition:.2s;}
  .switch i::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;}
  .switch input:checked + i{background:var(--green);} .switch input:checked + i::after{transform:translateX(24px);}
  .switch input:focus-visible + i{outline:2px solid var(--gold);outline-offset:2px;}
  .grp{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:16px 2px 8px;font-weight:700;}

  /* promo */
  .code{font-family:ui-monospace,Menlo,monospace;font-size:22px;font-weight:800;letter-spacing:.06em;background:var(--paper);border:2px dashed var(--gold);border-radius:8px;padding:14px;text-align:center;margin:12px 0;word-break:break-all;}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:var(--dark);color:var(--cream);padding:11px 18px;border-radius:24px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .live{font-size:11.5px;color:#C9B8A9;}
</style>
</head>
<body>

<div class="gate" id="gate">
  <h2>Azizo Riders</h2>
  <p>Sign in with the staff password to see today's delivery runs, grouped by branch and area.</p>
  <label for="urlIn">Backend URL <span style="font-weight:400">(leave blank if same website)</span></label>
  <input type="text" id="urlIn" placeholder="https://your-backend.example.com" autocapitalize="off" autocomplete="off">
  <label for="passIn">Staff password</label>
  <input type="password" id="passIn" placeholder="Staff password" onkeydown="if(event.key==='Enter')login()">
  <button onclick="login()">Sign in</button>
  <div class="err" id="gateErr" role="alert"></div>
  <a class="back-link" href="staff.html">← Staff screen</a>
</div>

<div id="app" style="display:none;">
  <header>
    <div class="wrap">
      <div class="bar">
        <div><h1>🛵 Rider screen</h1><small id="liveNote">Runs refresh by themselves</small></div>
        <div class="bar-actions">
          <a class="ghost" href="staff.html" style="text-decoration:none;display:inline-flex;align-items:center">Staff</a>
          <button class="ghost" onclick="logout()">Sign out</button>
        </div>
      </div>
      <div class="controls" style="margin:10px 0 4px">
        <select class="field grow" id="rBranch" onchange="load()"><option value="">All branches</option></select>
      </div>
    </div>
  </header>
  <main class="wrap"><div id="runs"></div></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<style>
  .grp-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 6px;font-weight:800;font-size:15px;}
  .grp-h small{font-weight:600;color:var(--ink-soft);display:block;font-size:12px;}
  .run{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;border-left:5px solid #c9bfb4;}
  .run.go{border-left-color:#2e7d46;} .run.road{border-left-color:#c89b3c;} .run.wait{opacity:.7;}
  .run h4{margin:0 0 2px;font-size:15px;} .run .sub{font-size:13px;color:var(--ink-soft);margin:2px 0;}
  .collect{display:inline-block;background:#fff4d6;border:1px solid #e8c766;border-radius:8px;padding:4px 9px;font-weight:800;margin:6px 0;}
  .paid{display:inline-block;background:#e8f5e9;border:1px solid #b7dfb9;border-radius:8px;padding:4px 9px;font-weight:700;margin:6px 0;color:#1b5e20;}
  .run .note{font-size:13px;background:#fff4d6;border-radius:8px;padding:6px 9px;margin:6px 0;}
  .run .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
</style>
<script>
(function(){
  'use strict';
  const TOKEN_KEY = 'azizoStaffToken', URL_KEY = 'azizoAdminBackendUrl';
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const backend = () => (localStorage.getItem(URL_KEY) || '').replace(/\/+$/, '');
  const token = () => sessionStorage.getItem(TOKEN_KEY) || '';
  const money = n => 'KSh ' + Number(n || 0).toLocaleString('en-KE');
  let timer = null, areaInfo = {};
  async function api(path, opts){
    opts = opts || {};
    const res = await fetch(backend() + path, Object.assign({}, opts, {headers: Object.assign({'Authorization': 'Bearer ' + token()}, opts.body ? {'Content-Type':'application/json'} : {}), cache:'no-store'}));
    const data = await res.json().catch(() => ({}));
    if(res.status === 401){ logout(true); throw new Error('Session expired - please sign in again'); }
    if(!res.ok) throw new Error(data.error || ('Request failed (' + res.status + ')'));
    return data;
  }
  function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600); }
  window.login = async function(){
    const url = $('urlIn').value.trim().replace(/\/+$/, ''), pass = $('passIn').value; $('gateErr').textContent = '';
    if(!pass){ $('gateErr').textContent = 'Enter the staff password.'; return; }
    localStorage.setItem(URL_KEY, url);
    try{
      const res = await fetch(url + '/api/auth/staff-login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({password: pass})});
      const data = await res.json().catch(() => ({})); if(!res.ok) throw new Error(data.error || ('Sign-in failed (' + res.status + ')'));
      sessionStorage.setItem(TOKEN_KEY, data.token); $('passIn').value = ''; start();
    }catch(e){ $('gateErr').textContent = e.message; }
  };
  window.logout = function(expired){ sessionStorage.removeItem(TOKEN_KEY); clearInterval(timer); $('app').style.display = 'none'; $('gate').style.display = 'block'; if(expired === true) $('gateErr').textContent = 'Session expired - please sign in again.'; };
  const waNumber = p => { const d = String(p || '').replace(/\D/g, ''); return d.startsWith('254') ? d : d.startsWith('0') ? '254' + d.slice(1) : d.length === 9 ? '254' + d : d; };
  const mapsUrl = o => (o.delivery_lat != null && o.delivery_lng != null) ? 'https://www.google.com/maps/search/?api=1&query=' + o.delivery_lat + ',' + o.delivery_lng : 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent((o.delivery_address || '') + ', Nairobi, Kenya');
  const first = n => String(n || '').split(' ')[0];
  function msg(o){
    return o.status === 'out_for_delivery'
      ? 'Hello ' + first(o.customer_name) + ', this is your Azizo rider. I am on my way with order #' + o.id + '. I will call when I am close.'
      : 'Hello ' + first(o.customer_name) + ', this is Azizo Butchery & Grill about your delivery for order #' + o.id + '.';
  }
  function card(o){
    const cls = o.status === 'out_for_delivery' ? 'road' : o.status === 'preparing' ? 'go' : 'wait';
    const pay = o.payment_method === 'cash' ? '<div class="collect">COLLECT ' + money(o.total) + ' cash</div>' : '<div class="paid">' + (o.payment_method === 'mpesa' ? 'M-Pesa' : esc(o.payment_method)) + ' - ' + money(o.total) + (o.mpesa_receipt ? ' · ' + esc(o.mpesa_receipt) : '') + '</div>';
    const items = (o.items || []).map(i => esc(i.qty) + (i.unit ? ' ' + esc(i.unit) : '') + ' ' + esc(i.name)).join(', ');
    const act = o.status === 'preparing' ? '<button class="btn go" onclick="move(' + o.id + ',\'out_for_delivery\')">Out for delivery</button>'
      : o.status === 'out_for_delivery' ? '<button class="btn go" onclick="move(' + o.id + ',\'completed\')">Delivered ✓</button>'
      : '<span class="sub">Still being packed</span>';
    return '<div class="run ' + cls + '"><h4>#' + o.id + ' · ' + esc(o.customer_name || 'Customer') + (o.pickup_time && o.pickup_time !== 'No preference' ? ' · ⏰ ' + esc(o.pickup_time) : '') + '</h4>' +
      '<div class="sub">' + esc(o.delivery_address || o.area || 'address not given') + '</div><div class="sub">' + items + '</div>' + pay +
      (o.notes ? '<div class="note">🔪 ' + esc(o.notes) + '</div>' : '') +
      '<div class="actions">' + act + '<a class="btn light" href="tel:' + esc(o.customer_phone) + '">📞 Call</a>' +
      '<a class="btn light" target="_blank" rel="noopener" href="https://wa.me/' + waNumber(o.customer_phone) + '?text=' + encodeURIComponent(msg(o)) + '">💬</a>' +
      '<a class="btn light" target="_blank" rel="noopener" href="' + mapsUrl(o) + '">📍 Map</a></div></div>';
  }
  window.load = async function(quiet){
    try{
      const d = await api('/api/orders?status=received,preparing,out_for_delivery');
      const br = $('rBranch').value;
      const list = (d.orders || []).filter(o => o.fulfilment === 'delivery' && (!br || o.branch === br));
      if(!list.length){ $('runs').innerHTML = '<div class="empty">No deliveries waiting. New ones appear here by themselves.</div>'; $('liveNote').textContent = 'Updated ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); return; }
      const groups = {};
      list.forEach(o => { const a = areaInfo[o.area || ''] || {}; const key = (o.branch || 'Branch') + '|' + (a.corridor || a.region || o.area || 'Other areas'); (groups[key] = groups[key] || []).push(o); });
      $('runs').innerHTML = Object.keys(groups).sort().map(k => {
        const [b, c] = k.split('|'), os = groups[k].sort((x, y) => String(x.area).localeCompare(String(y.area)) || x.id - y.id);
        const ready = os.filter(o => o.status === 'preparing'), cash = os.filter(o => o.payment_method === 'cash').reduce((n, o) => n + o.total, 0);
        return '<div class="grp-h"><div>' + esc(c) + '<small>from ' + esc(b) + ' · ' + os.length + ' stop' + (os.length === 1 ? '' : 's') + (cash ? ' · cash to collect ' + money(cash) : '') + '</small></div>' +
          (ready.length ? '<button class="btn go" onclick="runAll(\'' + ready.map(o => o.id).join(',') + '\')">Send ' + ready.length + ' out</button>' : '') + '</div>' + os.map(card).join('');
      }).join('');
      $('liveNote').textContent = 'Updated ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    }catch(e){ if(!quiet) $('runs').innerHTML = '<div class="empty">Couldn\'t load: ' + esc(e.message) + '</div>'; }
  };
  window.move = async function(id, status){
    try{ await api('/api/orders/' + id + '/status', {method:'PATCH', body: JSON.stringify({status})}); toast('Order #' + id + (status === 'completed' ? ' delivered' : ' out for delivery')); load(true); }
    catch(e){ toast("Couldn't update: " + e.message); }
  };
  window.runAll = async function(ids){
    if(!confirm('Mark these orders as out for delivery?')) return;
    for(const id of ids.split(',')) { try{ await api('/api/orders/' + id + '/status', {method:'PATCH', body: JSON.stringify({status:'out_for_delivery'})}); }catch(e){ toast(e.message); } }
    toast('Run started'); load(true);
  };
  async function start(){
    $('gate').style.display = 'none'; $('app').style.display = 'block';
    try{ const bl = (await api('/api/branches/all')).branches || []; const cur = localStorage.getItem('azizoRiderBranch') || ''; $('rBranch').innerHTML = '<option value="">All branches</option>' + bl.map(b => '<option value="' + esc(b.name) + '">' + esc(b.name) + '</option>').join(''); $('rBranch').value = cur; }catch(e){}
    $('rBranch').addEventListener('change', () => { try{ localStorage.setItem('azizoRiderBranch', $('rBranch').value); }catch(e){} });
    try{ (await api('/api/areas/all')).areas.forEach(a => { areaInfo[a.name] = a; }); }catch(e){}
    await load();
    clearInterval(timer); timer = setInterval(() => { if(!document.hidden) load(true); }, 30000);
  }
  const saved = localStorage.getItem(URL_KEY); if(saved !== null) $('urlIn').value = saved;
  if(token()) start();
})();
</script>
</body>
</html>
